# ════════════════════════════════════════════════════════════════
#  api.notiqlik.uz — backend API (FastAPI behind gunicorn)
# ════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name api.notiqlik.uz;

    client_max_body_size 2048M;

    limit_req zone=api_limit burst=60 nodelay;

    # Health probe (unlimited, no log noise)
    location = /health {
        proxy_pass http://notiq_backend/health;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Prometheus metrics (internal only)
    location = /metrics {
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://notiq_backend/metrics;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        access_log off;
    }

    # Stricter limit for auth endpoints
    location ~ ^/api/v1/auth/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://notiq_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI analysis endpoints — stricter limit
    location ~ ^/api/v1/(speech|observation)/ {
        limit_req zone=ai_limit burst=5 nodelay;
        proxy_pass http://notiq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # OpenAPI / Swagger UI — production disabled at app level
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://notiq_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lesson video upload — streams the body straight through to the app
    # instead of spooling the whole file to nginx's disk first. Only used
    # when object storage is unconfigured; the normal path uploads directly
    # to R2 from the browser and never reaches nginx at all.
    location ~ ^/api/v1/admin/lessons/[^/]+/video$ {
        proxy_pass http://notiq_backend;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A 2GB upload over a slow link legitimately takes a long time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HLS playlists are generated per request and embed short-lived
    # signatures — caching them would hand players URLs that have expired.
    # Scoped to the API path so it cannot shadow /media/ in the no-S3 fallback.
    location ~ ^/api/v1/courses/lessons/.*\.m3u8$ {
        proxy_pass http://notiq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "private, max-age=60" always;
    }

    # User-uploaded media
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;

        # Byte-range requests are what let a player seek without downloading
        # the whole file; nginx serves them for static files by default, this
        # just advertises it.
        add_header Accept-Ranges "bytes" always;
    }

    # WebSocket for support chat
    location ~ ^/(api/v1/)?support/ws {
        rewrite ^/support/ws(.*)$ /api/v1/support/ws$1 break;
        proxy_pass http://notiq_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Everything else → FastAPI
    location / {
        proxy_pass http://notiq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
